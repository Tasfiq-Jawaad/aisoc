<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Leeds AI Conference — coming soon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1322"/>
      <stop offset="1" stop-color="#160d14"/>
    </linearGradient>
    <radialGradient id="glowA" cx="20%" cy="22%" r="60%">
      <stop offset="0" stop-color="#eb5b6c" stop-opacity="0.40"/>
      <stop offset="55%" stop-color="#eb5b6c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#eb5b6c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="85%" cy="88%" r="55%">
      <stop offset="0" stop-color="#eb5b6c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#eb5b6c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="420" fill="url(#bg)"/>
  <rect width="1000" height="420" fill="url(#glowA)"/>
  <rect width="1000" height="420" fill="url(#glowB)"/>
  <rect x="16" y="16" width="968" height="388" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <!-- broadcast rings motif -->
  <g fill="none" stroke="#eb5b6c" stroke-opacity="0.35">
    <circle cx="500" cy="120" r="46" stroke-width="2"/>
    <circle cx="500" cy="120" r="66" stroke-width="1.5" stroke-opacity="0.18"/>
  </g>
  <circle cx="500" cy="120" r="9" fill="#eb5b6c"/>

  <!-- coming soon pill -->
  <rect x="406" y="200" width="188" height="34" rx="17" fill="#eb5b6c" fill-opacity="0.12" stroke="#eb5b6c" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="500" y="222" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="15" letter-spacing="3" fill="#ff909c">COMING SOON</text>

  <!-- title -->
  <text x="500" y="296" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="800" font-size="58" fill="#ffffff">Leeds <tspan fill="#eb5b6c">AI</tspan> Conference</text>

  <!-- accent bar -->
  <rect x="458" y="320" width="84" height="5" rx="2.5" fill="#eb5b6c" fill-opacity="0.85"/>

  <!-- tagline -->
  <text x="500" y="362" text-anchor="middle" font-family="'Geist', Arial, sans-serif" font-size="22" fill="#c9d2e3" fill-opacity="0.85">Getting students &amp; professionals ready for an AI-driven workplace</text>
</svg>
